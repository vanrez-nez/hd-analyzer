[workspace]
members = [
    "crates/hd-analyzer-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
humansize = "2.1"
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
