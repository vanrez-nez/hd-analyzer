[workspace]
members = [
    "crates/hd-analyzer-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
core-foundation-sys = "0.8"
humansize = "2.1"
jwalk = "0.8"
log = "0.4"
nix = { version = "0.31.3", features = ["fs"] }
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSString"] }
rayon = "1.11.0"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
thiserror = "2.0"
trash = "5.2.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
